<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <!--
      Setzt data-theme SOFORT synchron, bevor irgendetwas gerendert wird -
      verhindert einen kurzen Hell-Flash bei Systemeinstellung "Dunkel"
      (das eigentliche Modul-Script src/main.ts/lib/theme.svelte.ts lädt
      erst später und würde sonst zu spät kommen). Dieselbe Logik wie
      theme.svelte.ts resolveInitialTheme(), bewusst hier dupliziert, weil
      sie synchron vor jedem Modul-Code laufen muss.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('e-servicebericht:theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          // localStorage evtl. nicht verfügbar - dann bleibt es beim
          // Hell-Standard, kein harter Fehler.
        }
      })();
    </script>
    <title>Rivo</title>
    <meta name="description" content="Rivo – digitale Serviceberichte für Elektrohandwerk-Serviceeinsätze" />
    <meta name="theme-color" content="#2563eb" />

    <!-- iOS: App-artiges Verhalten im "Zum Home-Bildschirm hinzufügen"-Modus -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Rivo" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!-- manifest.webmanifest wird von vite-plugin-pwa automatisch (base-aware) injiziert -->

  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
