<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Rivo-Logo: stilisiertes "R"-Monogramm (Stamm + Bogen in Weiß, diagonales
    "Bein" in Lime-Grün, das aus dem Bogen-Loch heraus nach unten links
    schneidet) auf abgerundetem dunklem Badge - nachgebaut nach der vom
    Kunden bereitgestellten Logo-Vorlage.
  -->
  <rect width="512" height="512" rx="96" fill="#0a0a0a" />
  <rect x="180" y="150" width="44" height="210" rx="22" fill="#ffffff" />
  <rect x="180" y="150" width="150" height="100" rx="50" fill="#ffffff" />
  <rect x="214" y="174" width="82" height="52" rx="26" fill="#0a0a0a" />
  <polygon points="250,222 296,222 196,392 150,392" fill="#a3e635" />
</svg>
